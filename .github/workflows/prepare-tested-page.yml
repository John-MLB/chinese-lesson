name: Verify published lesson boards
on:
  push:
    branches: [layout-publish-20261124-header]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b2b08dbad9b2c387e73769b6c96a7e1cfffcad9
          persist-credentials: false
      - name: Compare the live teaching files with the tested release
        shell: python
        run: |
          from pathlib import Path
          from time import sleep, time_ns
          from urllib.request import urlopen
          for name in ('index.html','classroom-shell.js','classroom.html','lesson9.css','lesson9.js'):
              expected = Path(name).read_bytes()
              for attempt in range(12):
                  with urlopen('https://john-mlb.github.io/chinese-lesson/' + name + '?verify=' + str(time_ns()), timeout=25) as response:
                      if response.read() == expected:
                          break
                  sleep(5)
              else:
                  raise RuntimeError(name)
              print(name, 'verified')
      - name: Open the classroom pages in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/classroom-check" --no-audit --no-fund playwright-core@1.56.1
          cd "$RUNNER_TEMP/classroom-check"
          node <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1920,height:900}});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              for(const [route,selector] of [['lesson9-text-8','.continuous-board'],['lesson9-write','.empty'],['lesson9-recognize-1','.practice-intro'],['lesson9-words-1','.practice-intro'],['lesson9-revise-1','.practice-intro'],['lesson8-overview-1','.flow-column'],['home','.cards']]){
                await page.goto('https://john-mlb.github.io/chinese-lesson/?release=0b2b08d#'+route);
                const f=page.frameLocator('#classroom');
                await f.locator(selector).first().waitFor();
                if(route!=='home')assert(!(await f.locator('body > header').isVisible()));
                if(route==='lesson9-text-8'){
                  assert.equal((await f.locator('#reading-count').innerText()).trim(),'6 / 6');
                  assert((await f.locator('.continuous-board').boundingBox()).y<9);
                }
                if(selector==='.practice-intro'){
                  await f.locator('.practice-note-link:visible').first().click();
                  await f.locator('dialog[open]').waitFor();
                  await f.locator('[data-lesson9-close]:visible').first().click();
                  await f.locator('dialog[open]').waitFor({state:'hidden'});
                }
                console.log(route,'passed');
              }
              assert.deepEqual(errors,[]);
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
